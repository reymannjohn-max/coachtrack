<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CoachTrack">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CoachTrack</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#18181b;--mute:#6b6b74;--line:#e7e7ea;--brand:#dc2626;--brand-ink:#fff;--warn:#b45309;--bad:#b91c1c;--good:#15803d;--chip:#fdecec;--accent:#dc2626;color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,"Noto Color Emoji",sans-serif;padding-bottom:84px}
body.nonav{padding-bottom:20px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 14px;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:19px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:10px;padding:6px 12px;font-size:16px}
main{padding:12px 14px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
body.nonav nav{display:none}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:6px 2px 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:0}
nav button i{font-style:normal;font-size:26px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--brand);font-weight:700}
nav button.on i{filter:none;opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:12px 0 6px}
.mute{color:var(--mute);font-size:13px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:700}
.btn.big{width:100%;padding:14px;font-size:18px}
.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:15px}
.del{background:none;border:0;color:var(--bad);padding:6px 8px;font-size:16px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;color:var(--ink);font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;justify-content:center}
.tile i{font-style:normal;font-size:38px;line-height:1.1}
.tile small{font-weight:400;color:var(--mute);font-size:12px}
.tile.on{border-color:var(--brand);background:var(--chip)}
.tile.off{opacity:.45}
.tile .tx{display:flex;flex-direction:column;align-items:center}
.tiles.list{grid-template-columns:1fr}.tiles.list .tile{flex-direction:row;justify-content:flex-start;text-align:left;min-height:70px;gap:14px;padding:10px 16px}.tiles.list .tile i{font-size:34px}.tiles.list .tile .tx{align-items:flex-start}
.tiles.t3{grid-template-columns:repeat(3,1fr)}.tiles.t3 .tile{min-height:84px}.tiles.t3 .tile i{font-size:30px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stat{background:var(--chip);border-radius:14px;padding:8px 10px}
.stat b{display:block;font-size:19px}
.stat .ar{font-size:13px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;margin:1px 2px 1px 0}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.hero{background:linear-gradient(135deg,#ef4444,#991b1b);color:#fff;border:0}
.hero .mute{color:#fee2e2}.hero .btn{background:#fff;color:#b91c1c}
.ico{font-size:30px;width:46px;height:46px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.week{display:flex;justify-content:space-between}
.week div{text-align:center;font-size:11px;color:var(--mute)}
.week span{display:flex;width:36px;height:36px;margin:2px auto 0;border-radius:50%;border:2px solid var(--line);align-items:center;justify-content:center;font-size:18px}
.week .done span{background:var(--good);border-color:var(--good);color:#fff}
.week .rest span{border-style:dashed}
.week .today span{border-color:var(--brand)}
.drops{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:2px}
.drops button{border:0;background:none;font-size:26px;padding:2px;filter:grayscale(1);opacity:.35}
.drops button.on{filter:none;opacity:1}
.moods{display:flex;justify-content:space-between}
.moods button{border:2px solid transparent;background:none;font-size:34px;border-radius:14px;padding:2px 6px;filter:grayscale(.8);opacity:.6}
.moods button.on{filter:none;opacity:1;border-color:var(--brand);background:var(--chip)}
.ringin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.ringin b{font-size:22px}
.mealbtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;color:var(--ink);font-size:16px;font-weight:600;text-align:left}
.mealbtn i{font-style:normal;font-size:30px}
.mealbtn .plus{margin-left:auto;background:var(--brand);color:var(--brand-ink);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.setrow{display:flex;gap:6px;align-items:center;margin:8px 0}
.setrow .n{width:20px;color:var(--mute);font-weight:700}
.stp{display:flex;align-items:center;flex:1;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stp button{border:0;background:var(--chip);color:var(--ink);width:38px;height:46px;font-size:22px}
.stp div{flex:1;text-align:center;line-height:1.1}
.stp input{border:0;text-align:center;font-size:18px;font-weight:700;padding:4px 0;background:none}
.stp small{display:block;color:var(--mute);font-size:10px}
.chk{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:none;font-size:22px;color:var(--mute);flex:none}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.restbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;z-index:6}
.restbar b{font-size:22px;min-width:64px}
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid28 span{aspect-ratio:1;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px}
.grid28 .w{background:var(--good);color:#fff}.grid28 .f{background:var(--chip);border:1px solid var(--brand)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--brand)}
.q{text-align:center;margin:8px 0 16px}.q i{font-style:normal;font-size:56px;display:block}.q h2{font-size:22px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:10px;display:none;z-index:30}
svg text{fill:var(--mute);font-size:10px}
.pic{background:#fff;padding:0;overflow:hidden;border:1px solid var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.exan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.exan div{text-align:center;font-size:12px;color:var(--mute)}.exan img{width:100%;border-radius:12px;background:#fff;border:1px solid var(--line)}
.dob{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}.dob input{text-align:center;font-size:20px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0 12px}
.wd button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 0;font-size:13px;font-weight:700}
.wd button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.sug{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.sug button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px}
.sug button small{color:var(--mute);white-space:nowrap}
.fi{background:var(--chip);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.week .plan span{border-style:dashed;border-color:var(--brand)}

:root{--mp:#e11d48;--ms:#fda4af;--mb:#cfd8dd;--mo:#9fb0ba}

.bodies{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.bodies div{text-align:center;font-size:12px;color:var(--mute)}.bodies svg{width:100%;max-width:150px;height:auto}
.bodies .r{fill:var(--mb);stroke:var(--card);stroke-width:.7}.bodies .r.p{fill:var(--mp)}.bodies .r.s{fill:var(--ms)}.bodies .sil{fill:var(--mb);stroke:var(--mo);stroke-width:.8}
.leg{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mute);margin:2px 0 6px}.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.mbadge{display:inline-block;background:var(--chip);border-radius:10px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
.cb{display:flex;gap:8px;align-items:center}
.u{border:0;background:none;color:var(--brand);font:inherit;font-weight:700;padding:0;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.splits{display:flex;flex-direction:column;gap:8px}.tile.split{flex-direction:row;text-align:left;align-items:flex-start;min-height:0;padding:12px 14px}.tile.split .tx{display:flex;flex-direction:column;gap:2px;text-align:left;align-items:flex-start;width:100%}.tile.split small{color:var(--mute);font-weight:400;font-size:13px}.tile.split .why{font-size:12px}
.setrow .n small{display:block;font-size:9px;color:var(--warn);text-transform:uppercase;font-weight:700}
.stp small .u,.setrow .stp small .u{width:auto;height:auto;background:none;font-size:11px;font-weight:700;color:var(--brand);padding:0;line-height:1.2}
.xset{border:0;background:none;color:var(--bad);font-size:17px;width:26px;padding:0;flex:none}.xset:disabled{opacity:.25}
.addset{width:100%;margin-top:6px;border:2px dashed var(--brand);background:none;color:var(--brand);border-radius:12px;padding:10px;font-weight:700;font-size:15px}
.keep{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--ink);background:var(--chip);border-radius:10px;padding:8px 10px}.keep input{width:20px;height:20px;flex:none;accent-color:var(--brand)}
.rmex{border:0;background:none;color:var(--mute);font-size:13px;margin-top:6px;padding:4px 0;text-decoration:underline}.rmex.ask{color:var(--bad);font-weight:700}
.addexbtn{width:100%;border:2px dashed var(--brand);background:var(--card);color:var(--brand);border-radius:16px;padding:14px;font-weight:700;font-size:16px;margin-bottom:12px}

/* v2.5 look: deeper cards, muscle colors, done rows, nav pill */
:root{--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06)}

.card{box-shadow:var(--shadow);border-radius:18px}
h2{letter-spacing:-.01em}
.stat b{font-variant-numeric:tabular-nums}
nav button{position:relative}
nav button.on i{background:var(--chip);border-radius:16px;padding:0 14px}
.hero{box-shadow:0 8px 24px rgba(220,38,38,.3)}
.excard{border-left:5px solid var(--cat)}
.excard.alldone{border-color:var(--good);border-left-color:var(--good)}
.catb{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cat)}
.exn{display:block;font-size:17px}
.sethead{display:flex;gap:6px;margin-top:10px;padding:0 3px;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mute);text-align:center}
.sethead span:nth-child(1){width:34px}.sethead span:nth-child(2),.sethead span:nth-child(3){flex:1 1 0}.sethead span:nth-child(4){width:46px;margin-right:32px}
.setrow>.stp{flex:1 1 0;min-width:0}.setrow .stp>button{width:30px;flex:none}.setrow .stp>div{flex:1;min-width:0}.setrow .stp input{width:100%;min-width:0}
.setrow{border-radius:14px;padding:3px;transition:background .2s}
.setrow.done{background:color-mix(in srgb,var(--good) 18%,transparent)}
.setrow .n{width:34px;text-align:center}
.setrow .n .pv{color:var(--mute);font-size:9px;text-transform:none;font-weight:600}
.restbar{overflow:hidden}
.restp{position:absolute;left:0;top:0;height:3px;width:0;background:var(--accent);transition:width .5s linear}

/* Theme: Red & Black */
header{background:#111;color:#fff}
header button{background:rgba(255,255,255,.14)}
nav{background:#111;border-top-color:#111}
nav button{color:#a1a1aa}
nav button.on{color:#ef4444}
nav button.on i{background:#2a2a2a}
nav button i{filter:none;opacity:.85}
.hero{background:linear-gradient(135deg,#1f1f23,#000);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hero .mute{color:#d4d4d8}.hero .btn{background:#dc2626;color:#fff}
/* weight box: no clipping on narrow phones */
.setrow{gap:4px}.setrow .stp>button{width:24px;font-size:18px}.setrow .stp input{font-size:16px;padding:4px 0;letter-spacing:-.3px}.setrow .chk{width:40px;height:40px}.xset{width:20px}.excard{padding-left:10px;padding-right:10px}
.setrow .n{width:30px}.sethead span:nth-child(1){width:30px}
.mtags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}.mtag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--cat);background:color-mix(in srgb,var(--cat) 12%,transparent);border-radius:6px;padding:2px 7px}
.btn.play{width:48px;height:48px;border-radius:50%;padding:0;font-size:18px;flex:none}
.thumbs{display:flex;gap:6px;margin-top:10px;overflow-x:auto}.thumbs img{width:52px;height:52px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none;background:#fff}
.dayfig{display:inline-flex;gap:2px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 6px}
.dayfig svg{height:100%;width:auto}
.dayfig .r{fill:var(--mb);stroke:var(--card);stroke-width:.7}.dayfig .r.p{fill:var(--mp);animation:mpulse 1.8s ease-in-out infinite}.dayfig .r.s{fill:var(--ms)}.dayfig .sil{fill:var(--mb);stroke:var(--mo);stroke-width:.8}
.hero .dayfig{background:rgba(255,255,255,.1)}
@keyframes mpulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.dayfig .r.p{animation:none}}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:3px;margin-top:10px}.seg2 button{border:0;background:none;color:var(--ink);padding:8px;border-radius:10px;font-weight:700;font-size:14px}.seg2 button.on{background:var(--brand);color:var(--brand-ink)}
.sumt{border:2px solid transparent;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--ink);cursor:pointer}.sumt.on{border-color:var(--brand)}.sumt b{font-size:20px}.sumt b small{font-size:12px;color:var(--mute);font-weight:600}
.sumt .ar{font-size:11px;color:var(--mute)}.sumt .ar.up{color:var(--good)}.sumt .ar.dn{color:var(--bad)}
.tog{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;cursor:pointer}.tog i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.tog.on{background:var(--brand)}.tog.on i{left:25px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.cmp figure{margin:0}.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--chip)}.cmp figcaption{font-size:12px;color:var(--mute);text-align:center}
.phstrip{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.phstrip span{position:relative;flex:none;text-align:center}.phstrip img{width:56px;height:74px;object-fit:cover;border-radius:8px;display:block}.phstrip small{font-size:10px;color:var(--mute)}.phstrip .del{position:absolute;top:-4px;right:-4px;background:var(--card);border-radius:50%;padding:0 5px;font-size:12px;box-shadow:var(--shadow)}
.linkb{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px;padding:2px 0}
</style>
</head>
<body>
<header><button id="back" style="display:none">‹</button><h1 id="title">CoachTrack</h1><span id="hdr-actions"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="foods.js"></script>
<script src="exdata.js"></script>
<script src="exinfo.js"></script>
<script src="fedb.js"></script>
<script src="exphotos.js"></script>
<script>
/* ============ constants ============ */
const KEY='coachtrack.v1';
const APP_VERSION='2.5.0';
const GOALS={lose:['🔥','Lose fat','Burn more than I eat'],maintain:['⚖️','Stay fit','Keep my weight'],gain:['💪','Build muscle','Eat a bit more, lift heavier']};
const ACT={sedentary:[1.2,'🪑','Mostly sitting','Desk day, no workouts'],light:[1.375,'🚶','Lightly active','1-3 workouts a week'],moderate:[1.55,'🏃','Active','3-5 workouts a week'],very:[1.725,'🔥','Very active','6-7 workouts a week'],extra:[1.9,'🏗️','Athlete / hard labor','Physical job or 2 a day']};
const METRICS=[['weight','Weight','kg','⚖️'],['bf','Body fat','%','🧍'],['waist','Waist','cm','📏'],['hips','Hips','cm','📐'],['chest','Chest','cm','🛡️'],['shoulders','Shoulders','cm','🤷'],['arm','Arm','cm','💪'],['thigh','Thigh','cm','🦵'],['calf','Calf','cm','🦶'],['rhr','Resting HR','bpm','❤️']];
const MEALS=[['Breakfast','🌅'],['Lunch','🍱'],['Dinner','🍽️'],['Snack','🍎']];
const MICON={Chest:'🛡️',Back:'🔙',Shoulders:'🤷',Biceps:'💪',Triceps:'🦾',Legs:'🦵',Core:'🎯',Cardio:'🏃'};

function age(dob){if(!dob)return null;const d=new Date(dob),n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a}
function latest(c,k){for(let i=c.checkins.length-1;i>=0;i--){const v=num(c.checkins[i][k]);if(v!=null)return v}return null}
function first(c,k){for(const ch of c.checkins){const v=num(ch[k]);if(v!=null)return v}return null}
function calc(c){
  const w=latest(c,'weight'),bf=latest(c,'bf'),a=age(c.dob),ck=+c.kcalCustom>0?+c.kcalCustom:0;
  if((!w||!c.heightCm||a==null)&&ck){const p=w?c.proteinPerKg*w:ck*.3/4,f=(c.fatPct/100)*ck/9;return{w,custom:true,bmr:null,method:'',tdee:null,adj:0,kcal:ck,p,f,carb:Math.max(0,(ck-4*p-9*f)/4),warn:''}}
  if(!w||!c.heightCm||a==null)return{err:'Add birth date, height and weight in My profile to get calorie targets.'};
  let bmr,method;
  if(c.formula==='katch'&&bf){bmr=370+21.6*w*(1-bf/100);method='Katch-McArdle'}
  else{bmr=10*w+6.25*c.heightCm-5*a+(c.sex==='F'?-161:5);method='Mifflin-St Jeor'}
  const tdee=bmr*ACT[c.activity][0];
  const adj=c.goal==='lose'?-c.rate:c.goal==='gain'?c.rate:0;
  const auto=tdee+adj,kcal=ck||auto,p=c.proteinPerKg*w,f=(c.fatPct/100)*kcal/9,carb=Math.max(0,(kcal-4*p-9*f)/4);
  return{w,bf,a,bmr,method,tdee,adj:ck?Math.round(ck-tdee):adj,auto,custom:!!ck,kcal,p,f,carb,warn:kcal<bmr?'Target is below your BMR. Be careful and review it.':''};
}

function macroBar(icon,l,v,tg){return`<div style="margin:5px 0"><div class="row"><span>${icon} ${l}</span><span class="sp"></span><span class="mute">${r0(v)}/${r0(tg)} g</span></div><div class="bar"><i style="width:${Math.min(100,tg?v/tg*100:0)}%"></i></div></div>`}
const wGoal=m=>+m.waterGoal>0?+m.waterGoal:2000;
const wStep=m=>{const st=+m.waterStep>0?+m.waterStep:250,g=wGoal(m);return Math.ceil(g/st)>40?Math.ceil(g/40/10)*10:st};
function waterCard(m,d){const ml=m.water[d]||0,goal=wGoal(m),st=wStep(m),n=Math.floor(ml/st),dr=Math.max(1,Math.ceil(goal/st)),pc=Math.min(100,Math.round(ml/goal*100));
  return`<div class="card"><div class="row"><h2 class="sp" style="margin:0">💧 Water</h2><span class="mute">${fx(dV(ml),0)} / ${fx(dV(goal),0)} ${uV()}${ml>=goal?' ✅':''}</span></div><div class="bar" style="margin-top:8px"><i style="width:${pc}%"></i></div><div class="drops" style="margin-top:6px">${Array.from({length:dr},(_,i)=>`<button class="${i<n?'on':''}" data-act="drop" data-i="${i}" data-date="${d}" aria-label="${fx(dV(st),1)} ${uV()}">💧</button>`).join('')}</div><p class="mute" style="margin:2px 0 8px">One drop = ${fx(dV(st),US()?1:0)} ${uV()}</p><div class="row"><button class="sec sp" data-act="waterAdd" data-date="${d}">➕ Add amount</button><button class="sec sp" data-act="waterSet">⚙️ My goal</button></div></div>`}

function suggestFor(exId,item){
  const m=me();
  for(let i=m.sessions.length-1;i>=0;i--){
    const e=m.sessions[i].entries.find(x=>x.exId===exId);if(!e)continue;
    const sets=e.sets.filter(s=>isDone(s)&&+s.r>0);if(!sets.length)continue;
    const top=parseInt(String(item.reps).split('-').pop())||0,w=Math.max(...sets.map(s=>+s.w||0));
    const hit=top>0&&sets.length>=(+item.sets||1)&&sets.every(s=>+s.r>=top);
    const ex=exById(exId),inc=US()?(ex&&ex.cat==='Legs'?10:5)/LB:(ex&&ex.cat==='Legs'?5:2.5);
    return{last:sets.map(s=>`${fx(dW(+s.w||0),1)}×${s.r}`).join(', '),w,next:(hit&&w>0)?w+inc:null};
  }
  return null;
}

/* cardio: calories = MET x 3.5 x kg / 200 x minutes (Compendium of Physical Activities) */

/* food database: built-in list (per 100 g) + foods I saved */
const SRC_LABEL={c:'✔ Checked online',u:'USDA value (not re-checked)',e:'≈ Estimate',o:'Open Food Facts (online)',d:'USDA FoodData Central (online)',mine:'Saved by you'};
function foodItems(){
  const out=(typeof FOODDB!=='undefined'?FOODDB:[]).map(r=>({name:r[0],al:r[1],k:r[2],p:r[3],c:r[4],f:r[5],sl:r[6],sg:r[7],est:!!r[8],ic:r[9]||'🍽️',src:r[10]||(r[8]?'e':'u')})),have=new Set(out.map(x=>x.name.toLowerCase()));
  Object.entries(db.foods).forEach(([n,v])=>{if(have.has(n.toLowerCase()))return;const g=+v.g>0?+v.g:100,q=100/g;out.push({name:n,al:[],k:v.kcal*q,p:v.p*q,c:v.c*q,f:v.f*q,sl:+v.g>0?'last time':'saved portion',sg:g,mine:true,ic:v.ic||'🍽️',src:v.src||'mine'})});
  return out;
}
function foodSearch(items,q){
  q=q.trim().toLowerCase();if(!q)return[];
  const sc=x=>{const names=[x.name.toLowerCase(),...x.al.map(a=>a.toLowerCase())];let b=9;
    for(const n of names){if(n===q)b=Math.min(b,0);else if(n.startsWith(q))b=Math.min(b,1);else if(n.split(/[\s,()\/-]+/).some(w=>w.startsWith(q)))b=Math.min(b,2);else if(n.includes(q))b=Math.min(b,3)}return b};
  return items.map(x=>[sc(x),x]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||a[1].name.length-b[1].name.length).slice(0,6).map(a=>a[1]);
}

      const r=await BS.scan({formats:['Ean13','Ean8','UpcA','UpcE']});const c=r&&r.barcodes&&r.barcodes[0]&&r.barcodes[0].rawValue;
      if(c)lookupCode(c);else out.innerHTML=manualBc('No barcode read.');

/* ---- online food data (Open Food Facts + USDA FoodData Central) ---- */
function getBS(){try{return window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()?Capacitor.registerPlugin('BarcodeScanner'):null}catch(e){return null}}
async function getJson(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||15000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
function offItem(p){const n=p&&p.nutriments;if(!p||!p.product_name||!n)return null;let k=n['energy-kcal_100g'];if(k==null&&n['energy_100g']!=null)k=n['energy_100g']/4.184;if(k==null||isNaN(k))return null;
  const b=(p.brands||'').split(',')[0].trim();return{name:(p.product_name.trim()+(b?' ('+b+')':'')).slice(0,70),al:[],k:+k,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0,sl:'100 g',sg:100,ic:'🛒',src:'o',ph:(p.countries_tags||[]).includes('en:philippines')}}
async function offByCode(code){const j=await getJson('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,nutriments,countries_tags');return j&&j.status===1?offItem(j.product):null}
async function offSearch(q){const j=await getJson('https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=20&fields=product_name,brands,nutriments,countries_tags&search_terms='+encodeURIComponent(q));
  return (j.products||[]).map(offItem).filter(Boolean).sort((a,b)=>(b.ph?1:0)-(a.ph?1:0))}
async function usdaSearch(q){const key=(db.usdaKey||'').trim()||'DEMO_KEY';
  const j=await getJson('https://api.nal.usda.gov/fdc/v1/foods/search?query='+encodeURIComponent(q)+'&dataType=SR%20Legacy,Foundation&pageSize=10&api_key='+encodeURIComponent(key));
  const get=(f,no,id)=>{const x=(f.foodNutrients||[]).find(n=>String(n.nutrientNumber)===no||n.nutrientId===id);return x&&x.value!=null?+x.value:null};
  return (j.foods||[]).map(f=>{const k=get(f,'208',1008);if(k==null)return null;return{name:String(f.description).slice(0,70),al:[],k,p:get(f,'203',1003)||0,c:get(f,'205',1005)||0,f:get(f,'204',1004)||0,sl:'100 g',sg:100,ic:'🍽️',src:'d'}}).filter(Boolean)}
async function onlineFoods(q){const r=await Promise.allSettled([offSearch(q),usdaSearch(q)]);if(r.every(x=>x.status==='rejected'))throw new Error('offline');

/* ---- summary: food, cardio, training, water by day / week / month ---- */
const SUM_MET=[['kcal','🍽️ Calories','avg','kcal'],['workouts','🏋️ Workouts','sum',''],['sets','🔁 Sets','sum',''],['cmin','🏃 Cardio','sum','min'],['ckcal','🔥 Burned','sum','kcal'],['water','💧 Water','avg','ml']];
function dayVal(m,d,k){
  if(k==='kcal')return dayTotals(m,d).kcal||0;
  if(k==='workouts')return m.sessions.filter(s=>s.date===d).length;
  if(k==='sets')return m.sessions.filter(s=>s.date===d).reduce((a,s)=>a+s.entries.reduce((b,e)=>b+e.sets.filter(isDone).length,0),0);
  if(k==='cmin')return (m.cardio||[]).filter(x=>x.date===d).reduce((a,x)=>a+(+x.min||0),0);
  if(k==='ckcal')return (m.cardio||[]).filter(x=>x.date===d).reduce((a,x)=>a+(+x.kcal||0),0);
  if(k==='water')return m.water[d]||0;return 0}
const monday=d=>{const dow=(new Date(d+'T00:00:00').getDay()+6)%7;return shiftDate(d,-dow)};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function buckets(per){const t=today(),B=[];
  if(per==='day')for(let i=13;i>=0;i--){const d=shiftDate(t,-i);B.push({lab:i===0?'Today':String(+d.slice(8)),days:[d]})}
  else if(per==='week'){const m0=monday(t);for(let i=7;i>=0;i--){const s0=shiftDate(m0,-7*i),days=Array.from({length:7},(_,j)=>shiftDate(s0,j)).filter(x=>x<=t);B.push({lab:i===0?'This':MON[+s0.slice(5,7)-1].slice(0,3)+' '+(+s0.slice(8)),days})}}
  else{const y=+t.slice(0,4),mo=+t.slice(5,7);for(let i=5;i>=0;i--){let yy=y,mm=mo-i;while(mm<1){mm+=12;yy--}const pre=yy+'-'+String(mm).padStart(2,'0'),n=new Date(yy,mm,0).getDate(),days=Array.from({length:n},(_,j)=>pre+'-'+String(j+1).padStart(2,'0')).filter(x=>x<=t);B.push({lab:MON[mm-1],days})}}
  return B}
function bucketVal(m,b,k,agg){const v=b.days.map(d=>dayVal(m,d,k));if(agg==='sum')return v.reduce((a,x)=>a+x,0);const L=v.filter(x=>x>0);return L.length?L.reduce((a,x)=>a+x,0)/L.length:0}
function barChart(vals,labs,goal,unit){const W=340,H=170,pl=34,pb=22,pt=10,mx=Math.max(1,goal||0,...vals)*1.1,bw=(W-pl-6)/vals.length,y=v=>H-pb-(v/mx)*(H-pb-pt);

  ${vals.map((v,i)=>`<rect x="${pl+i*bw+bw*.15}" y="${y(v)}" width="${bw*.7}" height="${Math.max(0,H-pb-y(v))}" rx="3" fill="${i===last?'var(--brand)':'color-mix(in srgb,var(--brand) 45%,var(--card))'}"><title>${labs[i]}: ${r0(v)} ${unit}</title></rect>${v>0&&vals.length<=8?`<text x="${pl+i*bw+bw/2}" y="${y(v)-3}" font-size="10" text-anchor="middle" fill="var(--ink)">${v>=1000?r1(v/1000)+'k':r0(v)}</text>`:''}`).join('')}
  ${goal?`<line x1="${pl}" x2="${W-4}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="${W-4}" y="${y(goal)-4}" font-size="10" text-anchor="end" fill="var(--ink)">goal ${r0(goal)}</text>`:''}
  ${labs.map((l,i)=>(vals.length<=8||i%2===(last%2))?`<text x="${pl+i*bw+bw/2}" y="${H-6}" font-size="9.5" text-anchor="middle" fill="var(--mute)">${esc(l)}</text>`:'').join('')}</svg>`}
function viewSummary(m){const per=S.sumPer||'week',k=S.sumMet||'kcal',met=SUM_MET.find(x=>x[0]===k),B=buckets(per);
  const conv=(key,v)=>key==='water'?dV(v):v,unitOf=key=>key==='water'?uV():(SUM_MET.find(x=>x[0]===key)||[])[3];
  const vals=B.map(b=>conv(k,bucketVal(m,b,k,met[2])));
  const t=calc(m),goal=k==='kcal'&&!t.err?t.kcal:k==='water'?dV(wGoal(m)):k==='cmin'&&per!=='day'?(per==='week'?(+m.cardioGoal||150):(+m.cardioGoal||150)*4.3):0;

  else if(ds.it){prog(S.progId).days[+ds.d].items[+ds.i][ds.it]=t.value;save()}
  else if(ds.lg){const L=S.log;if(!L)return;if(ds.lg==='date')L.date=t.value;else L.entries[+ds.i].sets[+ds.j][ds.lg]=(ds.lg==='w'&&t.value!=='')?r4(sW(t.value)):t.value}
  else if(t.id==='imp'){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!d.clients||!d.programs)throw 0;if(confirm('Replace my data with this backup?')){if(Array.isArray(d.photos)){PHOTOS=d.photos;savePhotos()}delete d.photos;db=d;ensure();save();render();toast('Restored ✅')}}catch(_){toast('Not a valid backup file')}})}
});
document.addEventListener('input',e=>{const t=e.target;if(t.matches&&t.matches('.dob input')){t.value=t.value.replace(/\D/g,'');if(t.value.length>=t.maxLength&&t.id.endsWith('d')||t.value.length>=t.maxLength&&t.id.endsWith('m')){const n=document.getElementById(t.id.slice(0,-1)+(t.id.endsWith('d')?'m':'y'));if(n){n.focus();n.select()}}}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});if(CAP()){try{caches.keys().then(k=>k.forEach(n=>caches.delete(n)))}catch(e){}}}
render();
setTimeout(autoBackup,1500);
if(CAP()&&db.rem)applyReminders();

</script>
